stages:
  - test
  - build
  - verify

default:
  interruptible: true

backend-tests:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-python312
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  before_script:
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  script:
    - python -m pip_audit -r requirements.txt
    - python -m compileall -q app tests
    - python -m pytest -q

frontend-tests-build:
  stage: build
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  script:
    - cd frontend
    - npm ci
    - npm audit --audit-level=high --registry=https://registry.npmjs.org
    - npm run test
    - npm run build
  artifacts:
    expire_in: 7 days
    paths:
      - frontend/dist/

release-static-checks:
  stage: verify
  image:
    name: docker:27-cli
    entrypoint: [""]
  before_script:
    - apk add --no-cache git
  script:
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        git diff --check "$CI_MERGE_REQUEST_DIFF_BASE_SHA"...HEAD
      else
        git diff-tree --check --no-commit-id --root -r HEAD
      fi
    - docker compose config --quiet

# A real multi-stage image build needs a Docker daemon. Keep ordinary branch
# and merge-request checks daemonless; release tags enable this gate
# automatically, and maintainers can opt in elsewhere with CI_DOCKER_BUILD=1.
docker-image-build:
  stage: verify
  image:
    name: docker:27-cli
    entrypoint: [""]
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_DOCKER_BUILD == "1"'
    - when: never
  script:
    - docker info
    - docker build --pull --tag "oss-ci:${CI_COMMIT_SHA}" .
