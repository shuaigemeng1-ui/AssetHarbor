<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>oss · 图床</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>">
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --border: #262b36;
      --text: #e6e9ef; --muted: #8b93a3; --accent: #4f8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 15px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; justify-content: center;
    }
    main { width: min(680px, 92vw); padding: 48px 0 64px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: .5px; }
    h1 span { color: var(--accent); }
    .subtitle { color: var(--muted); margin: 6px 0 28px; }
    .drop {
      border: 2px dashed var(--border); border-radius: 14px; background: var(--panel);
      padding: 56px 20px; text-align: center; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .drop.dragover { border-color: var(--accent); background: #1a2233; }
    .drop .hint { color: var(--muted); margin: 0; font-size: 15px; }
    .drop .sub { color: var(--muted); opacity: .7; font-size: 12px; margin-top: 8px; }
    #results { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 12px; }
    #results li {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; display: flex; gap: 14px; align-items: center;
    }
    #results img {
      width: 64px; height: 64px; object-fit: cover; border-radius: 8px;
      background: #000; flex-shrink: 0;
    }
    #results .meta { flex: 1; min-width: 0; }
    #results .url { display: block; color: var(--accent); font-size: 13px;
      word-break: break-all; font-family: ui-monospace, monospace; }
    #results .info { color: var(--muted); font-size: 12px; margin-top: 2px; }
    button.copy {
      border: 1px solid var(--border); background: transparent; color: var(--text);
      border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; flex-shrink: 0;
    }
    button.copy:hover { border-color: var(--accent); color: var(--accent); }
    .error {
      background: #2a1418; border: 1px solid #5c2a33; color: #ff9dab;
      border-radius: 12px; padding: 12px 16px; margin-top: 16px; font-size: 14px;
    }
    footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>oss<span>.</span></h1>
    <p class="subtitle">自托管图床 · 上传即得短码链接</p>

    <div class="drop" id="drop" tabindex="0" role="button" aria-label="选择或拖拽图片上传">
      <input type="file" id="file" accept="image/*" multiple hidden>
      <p class="hint">点击选择 或 拖拽图片到此处</p>
      <p class="sub">支持 jpg / png / gif / webp / svg / bmp / ico / avif / tiff</p>
    </div>

    <ul id="results"></ul>
    <footer>API 文档见 <a href="/docs">/docs</a> · 健康检查 <a href="/healthz">/healthz</a></footer>
  </main>

<script>
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');
  const results = document.getElementById('results');

  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });
  fileInput.addEventListener('change', () => uploadFiles([...fileInput.files]));

  ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => {
    e.preventDefault(); drop.classList.add('dragover');
  }));
  ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => {
    e.preventDefault(); drop.classList.remove('dragover');
  }));
  drop.addEventListener('drop', e => uploadFiles([...e.dataTransfer.files]));

  async function uploadFiles(files) {
    if (!files.length) return;
    for (const file of files) {
      const item = document.createElement('li');
      item.innerHTML = '<div class="meta"><span class="info">上传中…</span></div>';
      results.prepend(item);

      try {
        const fd = new FormData();
        fd.append('file', file, file.name);
        const resp = await fetch('/api/upload', { method: 'POST', body: fd });
        const body = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(body.detail || `HTTP ${resp.status}`);

        const size = (body.size / 1024).toFixed(1) + ' KB';
        item.innerHTML = `
          <img src="/i/${body.code}" alt="" referrerpolicy="no-referrer">
          <div class="meta">
            <span class="url">${escapeHtml(body.url)}</span>
            <span class="info">${size} · ${escapeHtml(body.content_type)} · ${body.code}</span>
          </div>
          <button class="copy" data-url="${escapeHtml(body.url)}">复制</button>`;
        item.querySelector('.copy').addEventListener('click', e => copyText(e.target.dataset.url, e.target));
      } catch (err) {
        item.remove();
        const el = document.createElement('div');
        el.className = 'error';
        el.textContent = `${file.name}: ${err.message}`;
        results.prepend(el);
      }
    }
    fileInput.value = '';
  }

  async function copyText(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    const old = btn.textContent;
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = old, 1200);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
</script>
</body>
</html>
