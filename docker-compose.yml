services:
  oss:
    build: .
    # 发布到仓库时替换为自己的镜像名，例如 ghcr.io/your-name/oss:latest。
    image: oss:latest
    container_name: oss
    restart: unless-stopped
    # bridge（默认）使用端口映射；host 直接监听宿主机网络（仅 Linux）。
    network_mode: "${NETWORK_MODE:-bridge}"
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      OSS_DATA_DIR: /data
      OSS_APP_PORT: "${PORT:-8080}"
      # 反代位于其他主机/容器时，必须改为其来源 IP 或网段（如 172.17.0.0/16），
      # 否则 X-Forwarded-For 不被信任，所有访客将共用同一个限流身份。
      OSS_FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      OSS_MAX_UPLOAD_SIZE_MB: "${MAX_UPLOAD_SIZE_MB:-10}"
      OSS_MAX_VIDEO_SIZE_MB: "${MAX_VIDEO_SIZE_MB:-2048}"
      OSS_VIDEO_CHUNK_SIZE_MB: "${VIDEO_CHUNK_SIZE_MB:-8}"
      OSS_VIDEO_UPLOAD_TTL_HOURS: "${VIDEO_UPLOAD_TTL_HOURS:-168}"
      OSS_MAX_ACTIVE_VIDEO_UPLOADS: "${MAX_ACTIVE_VIDEO_UPLOADS:-3}"
      OSS_VIDEO_CHUNK_CONCURRENCY: "${VIDEO_CHUNK_CONCURRENCY:-3}"
      OSS_MIN_FREE_SPACE_MB: "${MIN_FREE_SPACE_MB:-1024}"
      OSS_USER_STORAGE_QUOTA_MB: "${USER_STORAGE_QUOTA_MB:-0}"
      OSS_TEAM_STORAGE_QUOTA_MB: "${TEAM_STORAGE_QUOTA_MB:-0}"
      OSS_VIDEO_CLEANUP_INTERVAL_SECONDS: "${VIDEO_CLEANUP_INTERVAL_SECONDS:-3600}"
      OSS_SQLITE_BUSY_TIMEOUT_MS: "${SQLITE_BUSY_TIMEOUT_MS:-5000}"
      OSS_SHORT_CODE_LENGTH: "${SHORT_CODE_LENGTH:-10}"
      OSS_PUBLIC_URL: "${PUBLIC_URL:-}"
      OSS_ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      OSS_ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-closed}"
      OSS_INVITE_CODE: "${INVITE_CODE:-}"
      OSS_TOKEN_EXPIRE_MINUTES: "${TOKEN_EXPIRE_MINUTES:-10080}"
      OSS_LOGIN_RATE_LIMIT_PER_MINUTE: "${LOGIN_RATE_LIMIT_PER_MINUTE:-20}"
      OSS_LOGIN_RATE_LIMIT_PER_USERNAME: "${LOGIN_RATE_LIMIT_PER_USERNAME:-5}"
      OSS_REGISTRATION_RATE_LIMIT_PER_MINUTE: "${REGISTRATION_RATE_LIMIT_PER_MINUTE:-10}"
      OSS_REGISTRATION_RATE_LIMIT_PER_USERNAME: "${REGISTRATION_RATE_LIMIT_PER_USERNAME:-3}"
      OSS_IMAGES_RATE_LIMIT_PER_MINUTE: "${IMAGES_RATE_LIMIT_PER_MINUTE:-240}"
      OSS_UPLOAD_RATE_LIMIT_PER_MINUTE: "${UPLOAD_RATE_LIMIT_PER_MINUTE:-60}"
      OSS_VIDEO_PART_RATE_LIMIT_PER_MINUTE: "${VIDEO_PART_RATE_LIMIT_PER_MINUTE:-1000}"
      OSS_API_KEY_MUTATION_RATE_LIMIT_PER_DAY: "${API_KEY_MUTATION_RATE_LIMIT_PER_DAY:-100}"
      OSS_MAX_API_KEYS_PER_USER: "${MAX_API_KEYS_PER_USER:-20}"
      OSS_TRAFFIC_RETENTION_DAYS: "${TRAFFIC_RETENTION_DAYS:-365}"
      OSS_JWT_SECRET: "${JWT_SECRET:-}"
      OSS_SIGNED_URL_TTL_SECONDS: "${SIGNED_URL_TTL_SECONDS:-86400}"
    volumes:
      # SQLite、正式媒体文件和 /data/uploads 断点续传临时文件统一持久化。
      - ./data:/data
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
